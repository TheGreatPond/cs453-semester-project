openapi: 3.0.3
info:
  title: CS453 Semeter Project API
  version: 1.0.0
  description: First Swagger doc, describing basic CRUD operations on a list of tasks

security:
  - bearerAuth: []

servers:
  - url: http://localhost:3000

paths:
  /auth/login:
    post:
      summary: "Login"
      requestBody:
        description: "needs a username and password"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsernameAndPassword"
      responses:
        "201":
          description: "Null response"
        "400":
          description: "Invalid request, task not created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInvalidBody"

  /auth/me:
    get:
      summary: test login auth token
      responses:
        "200":
          description: Single user returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Username"
        "404":
          description: "Resource requested not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorNotFound"
  /health:
    get:
      summary: "Health check test"
      responses:
        "200":
          description: "Server is running"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  status:
                    type: "string"
                    example: "ok"
  /projects:
    get:
      summary: Get list of users
      responses:
        "200":
          description: List of users returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    post:
      summary: "Adds new user to list"
      requestBody:
        description: "needs a username"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: "Null response"
        "400":
          description: "Invalid request, task not created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInvalidBody"

  /projects/{name}:
    get:
      summary: Get project from list
      parameters:
        - in: path
          name: name
          schema:
            type: string
          required: true
          description: name of the project to get
      responses:
        "200":
          description: Single project returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: "Resource requested not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorNotFound"
  /projects/members:
    get: 
      summary: "Get list of project members"
      responses:        
        "200":
          description: "list of users returned"
    post:
      summary: "Adds new user to a project"
      requestBody:
        description: "needs a username and project"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectAndUser"
      responses:
        "200":
          description: Single project and user returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAndUser"
        "404":
          description: "Resource requested not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorNotFound"
    delete:
      summary: "Remove user from project"
      requestBody:
        description: "needs a username and project"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectAndUser"
      responses:
        "204":
          description: SCode 204 returned for successful deletion
        "404":
          description: "Resource requested not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorNotFound"


  #
  # Remember:
  # - Express routes use :id, such as /tasks/:id.
  # - OpenAPI paths use {id}, such as /tasks/{id}.
  #
  # You may define schemas under components/schemas if you want to avoid
  # repeating the same object structure many times.

components:
  schemas:
    Project:
      type: object
      required:
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
          example: "exampleProject"
        created_at:
          type: string
          example: "creation_time"
        updated_at:
          type: string
          example: "updated_time"
    ProjectInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "exampleProject"

    ProjectAndUser:
      type: object
      required:
        - project_name
        - user_name
      properties:
        project_name:
          type: string
          example: "first_project"
        user_name:
          type: string
          example: "user2@email.com"
  # DONE: Define an ErrorResponse schema with an error message.
    ErrorNotFound:
      type: object
      properties:
        Error:
          type: string
          example: "The resource you were looking for could not be found, please correct your path and try again"
    ErrorInvalidBody:
      type: object
      properties:
        Error:
          type: string
          example: "Invalid request body, please adjust your request and try again."
    UsernameAndPassword:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: "user1@email.com"
        password:
          type: string
          example: "user1@email.com-password"
    Username:
      type: object
      required:
        - username
      properties:
        username:
          type: string
          example: "exampleuser"
  securitySchemes:
    bearerAuth:            # Arbitrary name for the scheme
      type: http
      scheme: bearer
      bearerFormat: JWT    # Optional hint for documentation