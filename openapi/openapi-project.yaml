openapi: 3.0.3
info:
  title: CS453 Semeter Project API
  version: 1.0.0
  description: First Swagger doc, describing basic CRUD operations on a list of tasks

security:
  - bearerAuth: []

servers:
  - url: http://localhost:3000

paths:
  /api/auth/login:
    post:
      summary: "Login"
      requestBody:
        description: "needs a username and password"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsernameAndPassword"
      responses:
        "201":
          description: "Null response"
        "400":
          description: "Invalid request, task not created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInvalidBody"

  /api/auth/me:
    get:
      summary: test login auth token
      responses:
        "200":
          description: Single user returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Username"
        "404":
          description: "Resource requested not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorNotFound"
  /health:
    get:
      summary: "Health check test"
      responses:
        "200":
          description: "Server is running"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  status:
                    type: "string"
                    example: "ok"
  /api/projects:
    get:
      summary: Get list of users
      responses:
        "200":
          description: List of users returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    post:
      summary: "Adds new user to list"
      requestBody:
        description: "needs a username"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: "Null response"
        "400":
          description: "Invalid request, task not created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInvalidBody"

  /api/projects/{name}:
    get:
      summary: Get project from list
      parameters:
        - in: path
          name: name
          schema:
            type: string
          required: true
          description: name of the project to get
      responses:
        "200":
          description: Single project returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: "Resource requested not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorNotFound"
