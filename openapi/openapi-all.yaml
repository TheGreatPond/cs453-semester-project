  #
  # Remember:
  # - Express routes use :id, such as /tasks/:id.
  # - OpenAPI paths use {id}, such as /tasks/{id}.
  #
  # You may define schemas under components/schemas if you want to avoid
  # repeating the same object structure many times.

components:
  schemas:
    Task:
      type: object
      required:
        - id
        - title
        - status
        - description
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          minimum: 1
        title:
          type: string
          example: "test-title"
        status:
          type: string
          example: "todo"
        description:
          type: string
          example: "tell me about yourself"
        created_at:
          type: string
          example: "creation_time"
        updated_at:
          type: string
          example: "updated_time"
    TaskInput:
      type: object
      required:
        - title
        - status
        - description
      properties:
        title:
          type: string
          example: "test-title"
        status:
          type: string
          example: "todo"
        description:
          type: string
          example: "tell me about yourself"
    User:
      type: object
      required:
        - name
        - created_at
        - updated_at
      properties:
        name:
          type: string
          example: "exampleuser"
        created_at:
          type: string
          example: "creation_time"
        updated_at:
          type: string
          example: "updated_time"
    UserInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "exampleuser"
    Project:
      type: object
      required:
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
          example: "exampleProject"
        created_at:
          type: string
          example: "creation_time"
        updated_at:
          type: string
          example: "updated_time"
    ProjectInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "exampleProject"
  # DONE: Define an ErrorResponse schema with an error message.
    ErrorNotFound:
      type: object
      properties:
        Error:
          type: string
          example: "The resource you were looking for could not be found, please correct your path and try again"
    ErrorInvalidBody:
      type: object
      properties:
        Error:
          type: string
          example: "Invalid request body, please adjust your request and try again."