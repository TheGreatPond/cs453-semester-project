openapi: 3.0.3
info:
  title: CS453 Semeter Project API
  version: 1.0.0
  description: First Swagger doc, describing basic CRUD operations on a list of tasks

servers:
  - url: http://localhost:3000

paths:
  /health:
    get:
      summary: "Health check test"
      responses:
        "200":
          description: "Server is running"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  status:
                    type: "string"
                    example: "ok"
  /api/tasks:
    get:
      summary: Get list of tasks
      responses:
        "200":
          description: List of tasks returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: [{"id": 2,"title": "second task","description": "this is the second task.","status": "done","created_at": "2026-07-14T07:47:21.716Z","updated_at": "2026-07-14T07:47:21.716Z"},{"id": 3,"title": "third task","description": "this is the third task.","status": "not started","created_at": "2026-07-14T07:50:21.716Z","updated_at": "2026-07-14T07:50:21.716Z"},{"id": 4,"title": "rip kurt","description": "kurt-da-king","status": "was-here","created_at": "2026-07-15T09:17:38.732Z","updated_at": "2026-07-15T09:18:52.642Z"}]
    post:
      summary: "Adds new task to list"
      requestBody:
        description: "needs a title and status of task"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: "Null response"
        "400":
          description: "Invalid request, task not created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInvalidBody"

  /api/users:
    get:
      summary: Get list of users
      responses:
        "200":
          description: List of users returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    post:
      summary: "Adds new user to list"
      requestBody:
        description: "needs a username"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: "Null response"
        "400":
          description: "Invalid request, task not created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInvalidBody"


  /api/projects:
    get:
      summary: Get list of users
      responses:
        "200":
          description: List of users returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    post:
      summary: "Adds new user to list"
      requestBody:
        description: "needs a username"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: "Null response"
        "400":
          description: "Invalid request, task not created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInvalidBody"

  /api/tasks/{id}:
    get:
      summary: Get task from list
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Numeric ID of the task to get
      responses:
        "200":
          description: Single task returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: "Resource requested not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorNotFound"
    put:
      summary: Update one task in list
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Numeric ID of the task to update
      requestBody:
        description: "needs title and status of task"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "200":
          description: Single task returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: "Resource requested not found and could not be altered"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorNotFound"
        "400":
          description: "Invalid request, task not updated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInvalidBody"
    patch:
      summary: Update part of one task in list
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Numeric ID of the task to update
      requestBody:
        description: "needs a combination of any of the following: title or status"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"

      responses:
        "200":
          description: Single task returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: "Resource requested not found and could not be altered"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorNotFound"
        "400":
          description: "Invalid request, task not updated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInvalidBody"
    delete:
      summary: Delete task from db
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Numeric ID of the task to delete
      responses:
        "204":
          description: "Null response"
        "404":
          description: "Resource requested not found and therefore not deleted"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorNotFound"

  /api/users/{name}:
    get:
      summary: Get user from list
      parameters:
        - in: path
          name: name
          schema:
            type: string
          required: true
          description: name of the user to get
      responses:
        "200":
          description: Single user returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: "Resource requested not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorNotFound"
